<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Appointment Data Analyser</title>
  <link rel="stylesheet" href="bootstrap.min.css">
  <link href="tabulator.min.css" rel="stylesheet">
  <script src="papaparse.min.js"></script>
  <script type="text/javascript" src="tabulator.min.js"></script>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="card-title h3 mb-4 text-center">Upload Appointment CSV</h1>
            <input type="file" id="csvFile" accept=".csv" class="form-control mb-3" />
            <pre id="output" class="bg-body-secondary p-2 rounded small"></pre>
            <div id="results" class="mb-3"></div>
            <div id="patientUpcs"></div>
            <div id="patientUpcsTable" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="script.js"></script>
</body>
</html>
